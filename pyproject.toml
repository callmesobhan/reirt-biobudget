[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "reirt-biobudget"
version = "0.3.0"
description = "3D Deformable Biophysical Dose-Accumulation, DIR-Uncertainty Envelope, and Inverse Remaining-Budget Engine with Frontier Agent Harness for Multi-Course Re-Irradiation (Research Software — Not a Medical Device)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "Sobhan" }
]
keywords = [
    "medical-physics",
    "radiotherapy",
    "re-irradiation",
    "radiobiology",
    "eqd2",
    "deformable-image-registration",
    "uncertainty-quantification",
    "dicom-rt",
    "mcp",
    "agent-harness"
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "pydicom>=2.4",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
reirt-biobudget = "reirt_biobudget.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/reirt_biobudget"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py311"
